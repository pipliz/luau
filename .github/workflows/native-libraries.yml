name: Native libraries

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [codex/native-binaries]
    tags: ['native-*']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    if: github.repository == 'pipliz/luau'
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            flags: '-A x64'
            library: luau.dll
          - os: ubuntu-22.04
            rid: linux-x64
            flags: ''
            library: libluau.so
          - os: macos-15-intel
            rid: osx-x64
            flags: '-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0'
            library: libluau.dylib
          - os: macos-15
            rid: osx-arm64
            flags: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0'
            library: libluau.dylib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure
        run: cmake -S native-build -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - name: Build interpreter and bytecode compiler
        run: cmake --build build --config Release --parallel
      - name: Test exported ABI
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Install
        run: cmake --install build --config Release --prefix build/stage
      - name: Test installed library
        run: python native-build/smoke.py build/stage/lib/${{ matrix.library }}
      - name: Package with provenance and checksums
        run: python native-build/package.py --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luau-${{ matrix.rid }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish native release
    if: github.repository == 'pipliz/luau' && startsWith(github.ref, 'refs/tags/native-')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: luau-*
          path: packages
          merge-multiple: true
      - name: Publish tested binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" packages/* --verify-tag \
            --title "Luau $RELEASE_TAG" \
            --notes "Interpreter and source-to-bytecode compiler; no native code generator. Each archive includes headers, licenses, source/build provenance and SHA-256 checksums. See native-build/README.md for integration and ABI details."
